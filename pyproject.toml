[project]
name = "agenttrust"
version = "0.1.0"
description = "AgentTrust — Authorization gateway for AI agent payments"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "pydantic>=2.0",
    "cryptography>=41.0",
    "uvicorn>=0.20",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "razorpay>=1.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
